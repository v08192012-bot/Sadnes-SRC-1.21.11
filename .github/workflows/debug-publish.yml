name: Debug publish channels

on:
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: "probe1 git push"
        id: p1
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          w=$(mktemp -d); cd "$w"
          git init -q -b build-output
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          echo "probe1 $(date -u +%FT%TZ)" > probe1.txt
          git add probe1.txt
          git commit -qm "probe1"
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          out=$(git push --force origin build-output 2>&1); rc=$?
          echo "P1_RC=$rc" >> "$GITHUB_STEP_SUMMARY"
          if [ $rc -ne 0 ]; then echo "::error title=probe1-git-push::$(echo "$out" | tr '\n' ' ' | head -c 400)"; fi
          echo "rc=$rc" >> "$GITHUB_OUTPUT"

      - name: "probe2 contents API"
        id: p2
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          body=$(printf 'probe2 %s' "$(date -u +%FT%TZ)" | base64 -w0)
          out=$(gh api "repos/${GITHUB_REPOSITORY}/contents/probe2.txt" -X PUT \
            -f message="probe2" -f content="$body" -f branch="build-output" 2>&1); rc=$?
          if [ $rc -ne 0 ]; then echo "::error title=probe2-contents-api::$(echo "$out" | tr '\n' ' ' | head -c 400)"; fi
          echo "rc=$rc" >> "$GITHUB_OUTPUT"

      - name: "probe3 release with asset"
        id: p3
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          echo "probe3 asset $(date -u +%FT%TZ)" > probe3.txt
          out=$(gh release create "probe-${GITHUB_SHA::7}" probe3.txt \
            --target "$GITHUB_SHA" --title "probe" --notes "probe release" 2>&1); rc=$?
          if [ $rc -ne 0 ]; then echo "::error title=probe3-release::$(echo "$out" | tr '\n' ' ' | head -c 400)"; fi
          echo "rc=$rc" >> "$GITHUB_OUTPUT"

      - name: "probe4 issue exfil channel"
        id: p4
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          out=$(gh issue create --title "publish-channel probe ${GITHUB_SHA::7}" \
            --body "probe4 ok. p1=${{ steps.p1.outputs.rc }} p2=${{ steps.p2.outputs.rc }} p3=${{ steps.p3.outputs.rc }}" 2>&1); rc=$?
          if [ $rc -ne 0 ]; then echo "::error title=probe4-issue::$(echo "$out" | tr '\n' ' ' | head -c 400)"; fi
          echo "rc=$rc" >> "$GITHUB_OUTPUT"

      - name: Verdict
        env:
          P1: ${{ steps.p1.outputs.rc }}
          P2: ${{ steps.p2.outputs.rc }}
          P3: ${{ steps.p3.outputs.rc }}
          P4: ${{ steps.p4.outputs.rc }}
        run: |
          echo "results: git-push=$P1 contents-api=$P2 release=$P3 issue=$P4"
          if [ "$P1" = "0" ] || [ "$P2" = "0" ]; then echo "at least one publish channel works"; else echo "::error title=all-publish-channels-dead::git=$P1 api=$P2"; exit 1; fi
